<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Трекер занятий</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         oklch(97% 0.005 250);
      --surface:    oklch(100% 0 0);
      --raised:     oklch(95% 0.008 250);
      --border:     oklch(88% 0.010 250);
      --muted:      oklch(58% 0.015 250);
      --body:       oklch(20% 0.015 250);
      --accent:     oklch(56% 0.18  250);
      --accent-lt:  oklch(94% 0.04  250);
      --accent-dk:  oklch(44% 0.18  250);
      --success:    oklch(54% 0.16  150);
      --success-lt: oklch(94% 0.04  150);
      --danger:     oklch(52% 0.18   25);
      --danger-lt:  oklch(95% 0.04   25);
      --warn:       oklch(62% 0.16   75);
      --warn-lt:    oklch(96% 0.04   75);
      --r-sm: 6px; --r: 10px; --r-lg: 16px;
      --sh-sm: 0 1px 3px oklch(0% 0 0 / .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         oklch(14% 0.010 250);
        --surface:    oklch(18% 0.012 250);
        --raised:     oklch(22% 0.012 250);
        --border:     oklch(30% 0.014 250);
        --muted:      oklch(60% 0.012 250);
        --body:       oklch(92% 0.008 250);
        --accent:     oklch(68% 0.16  250);
        --accent-lt:  oklch(22% 0.05  250);
        --accent-dk:  oklch(78% 0.14  250);
        --success:    oklch(66% 0.14  150);
        --success-lt: oklch(20% 0.05  150);
        --danger:     oklch(66% 0.16   25);
        --danger-lt:  oklch(20% 0.06   25);
        --warn:       oklch(74% 0.14   75);
        --warn-lt:    oklch(20% 0.05   75);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* ── Header ── */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--sh-sm);
    }
    .app-header h1 { font-size: 16px; font-weight: 600; }
    .app-header .date-label { font-size: 13px; color: var(--muted); margin-left: auto; }
    .sync-indicator {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-left: 8px;
      animation: pulse 2s ease infinite;
    }
    .sync-indicator.loading { background: var(--warn); animation: spin 1s linear infinite; }
    .sync-indicator.error { background: var(--danger); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout {
      max-width: 1060px;
      margin: 0 auto;
      padding: 20px 16px 72px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; padding: 14px 12px 72px; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      overflow: hidden;
    }
    .card-hd {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-hd h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 140ms, color 140ms, border-color 140ms;
      white-space: nowrap;
      line-height: 1;
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dk); }
    .btn-ghost    { background: transparent; color: var(--accent); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled)   { background: var(--accent-lt); }
    .btn-danger   { background: transparent; color: var(--danger); border-color: var(--border); }
    .btn-danger:hover:not(:disabled)  { background: var(--danger-lt); }
    .btn-sm   { padding: 4px 10px; font-size: 13px; }
    .btn-icon { padding: 5px 7px; }

    /* ── Form ── */
    .fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .fg:last-child { margin-bottom: 0; }
    label { font-size: 13px; font-weight: 500; }
    .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
    input[type="text"], input[type="number"], input[type="date"] {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 14px;
      background: var(--raised);
      color: var(--body);
      width: 100%;
      transition: border-color 140ms, box-shadow 140ms;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(56% 0.18 250 / .14);
    }
    .ferr { font-size: 12px; color: var(--danger); min-height: 15px; }

    /* ── Student list ── */
    .s-list { display: flex; flex-direction: column; gap: 1px; padding: 6px; }
    .s-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--r);
      cursor: pointer;
      transition: background 120ms;
    }
    .s-item:hover { background: var(--raised); }
    .s-item.active { background: var(--accent-lt); }
    .s-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .s-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-lt);
      color: var(--accent);
      font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }
    .s-info { flex: 1; min-width: 0; }
    .s-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-sub  { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* balance badge */
    .bal {
      font-size: 13px; font-weight: 700;
      padding: 3px 9px;
      border-radius: 100px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .bal-ok   { background: var(--success-lt); color: var(--success); }
    .bal-warn { background: var(--warn-lt);    color: var(--warn);    }
    .bal-zero { background: var(--danger-lt);  color: var(--danger);  }

    .empty-state { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-icon  { font-size: 30px; margin-bottom: 8px; }

    /* ── Detail ── */
    .detail-ph { text-align: center; padding: 72px 24px; color: var(--muted); }
    .detail-ph .icon { font-size: 44px; margin-bottom: 12px; }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 18px; }
    @media (max-width: 440px) { .stats { grid-template-columns: repeat(2,1fr); } }
    .stat {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
    }
    .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .stat-val { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .stat-val.ok   { color: var(--success); }
    .stat-val.warn { color: var(--warn);    }
    .stat-val.low  { color: var(--danger);  }

    /* Big lesson button */
    .lesson-btn-wrap { margin-bottom: 18px; }
    .lesson-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--r);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 2px dashed var(--border);
      background: var(--raised);
      color: var(--body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 140ms, border-color 140ms, color 140ms;
    }
    .lesson-btn:hover:not(:disabled) {
      background: var(--success-lt);
      border-color: var(--success);
      color: var(--success);
    }
    .lesson-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .lesson-btn:disabled { opacity: .35; cursor: not-allowed; }
    .lesson-btn.debt {
      border-color: var(--warn);
      color: var(--warn);
    }
    .lesson-btn.debt:hover:not(:disabled) {
      background: var(--warn-lt);
      border-color: var(--warn);
      color: var(--warn);
    }

    /* History table */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: var(--raised); }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--raised); }
    .mono { font-variant-numeric: tabular-nums; }

    .tag {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 100px;
    }
    .tag-pay { background: var(--success-lt); color: var(--success); }
    .tag-use { background: var(--raised);     color: var(--muted);   border: 1px solid var(--border); }

    /* ── Modal ── */
    .backdrop {
      position: fixed; inset: 0;
      background: oklch(0% 0 0 / .4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 180ms;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--surface);
      border-radius: var(--r-lg);
      box-shadow: 0 8px 32px oklch(0% 0 0 / .20);
      width: 100%; max-width: 420px;
      transform: translateY(14px);
      transition: transform 180ms;
    }
    .backdrop.open .modal { transform: translateY(0); }
    .modal-hd {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-hd h3 { font-size: 15px; font-weight: 600; }
    .modal-bd { padding: 18px; }
    .modal-ft { padding: 10px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; inset: 0;
      background: oklch(0% 0 0 / .15);
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity 200ms;
    }
    .loading-overlay.show { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<header class="app-header">
  <span style="font-size:20px" aria-hidden="true">📚</span>
  <h1>Трекер занятий</h1>
  <div class="sync-indicator" id="syncIndicator" title="Синхронизация"></div>
  <span class="date-label" id="hdrDate"></span>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <div class="card-hd">
        <h2>Ученики</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddStudent()">+ Добавить</button>
      </div>
      <div class="s-list" id="studentList"></div>
    </div>
  </aside>

  <main>
    <div id="detail">
      <div class="detail-ph">
        <div class="icon">👈</div>
        <p style="font-size:14px">Выберите ученика слева</p>
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<div class="backdrop" id="mAddStudent" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-hd">
      <h3>Новый ученик</h3>
      <button class="btn btn-icon btn-ghost" onclick="closeM('mAddStudent')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="fg">
        <label for="sName">Имя</label>
        <input type="text" id="sName" placeholder="Аня Смирнова" autocomplete="off" />
        <span class="ferr" id="eSName"></span>
      </div>
      <div class="fg">
        <label for="sSubj">Предмет <span class="hint">(необязательно)</span></label>
        <input type="text" id="sSubj" placeholder="Математика, английский…" autocomplete="off" />
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeM('mAddStudent')">Отмена</button>
      <button class="btn btn-primary" onclick="saveStudent()">Добавить</button>
    </div>
  </div>
</div>

<div class="backdrop" id="mAddPay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-hd">
      <h3>Записать оплату</h3>
      <button class="btn btn-icon btn-ghost" onclick="closeM('mAddPay')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="fg">
        <label for="pDate">Дата оплаты</label>
        <input type="date" id="pDate" />
      </div>
      <div class="fg">
        <label for="pLessons">Количество занятий</label>
        <input type="number" id="pLessons" placeholder="4" min="1" step="1" />
        <span class="ferr" id="ePLessons"></span>
      </div>
      <div class="fg">
        <label for="pNote">Заметка <span class="hint">(необязательно)</span></label>
        <input type="text" id="pNote" placeholder="За апрель, пакет 8 занятий…" />
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeM('mAddPay')">Отмена</button>
      <button class="btn btn-primary" onclick="savePay()">Сохранить</button>
    </div>
  </div>
</div>

<div class="backdrop" id="mLesson" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-hd">
      <h3>Занятие прошло</h3>
      <button class="btn btn-icon btn-ghost" onclick="closeM('mLesson')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="fg">
        <label for="lDate">Дата</label>
        <input type="date" id="lDate" />
      </div>
      <div class="fg">
        <label for="lCount">Количество занятий <span class="hint">(обычно 1)</span></label>
        <input type="number" id="lCount" value="1" min="1" step="1" />
        <span class="ferr" id="eLCount"></span>
      </div>
      <div class="fg">
        <label for="lNote">Тема / заметка <span class="hint">(необязательно)</span></label>
        <input type="text" id="lNote" placeholder="Тема урока…" />
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeM('mLesson')">Отмена</button>
      <button class="btn btn-primary" onclick="saveLesson()">Отметить</button>
    </div>
  </div>
</div>

<div class="backdrop" id="mDelStudent" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-hd">
      <h3>Удалить ученика?</h3>
      <button class="btn btn-icon btn-ghost" onclick="closeM('mDelStudent')">✕</button>
    </div>
    <div class="modal-bd">
      <p id="delStudentText" style="font-size:14px;line-height:1.6"></p>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeM('mDelStudent')">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDelStudent()">Удалить</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://nmexbqjqmwjsdwhuerkw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZXhicWpxbXdqc2R3aHVlcmt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODc1MjgsImV4cCI6MjEwNDM2MzUyOH0.ydUjLGVtoEd6P8JIBYMlGicdNXTr4qJNr0BjiP1VEIE';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── State ─────────────────────────────────────────────
let students = [];
let sel = null;
let pendDel = null;

// ── UI helpers ────────────────────────────────────────
const syncInd = document.getElementById('syncIndicator');
const loadingOverlay = document.getElementById('loadingOverlay');

function showLoading() { loadingOverlay.classList.add('show'); }
function hideLoading() { loadingOverlay.classList.remove('show'); }

function setSyncState(state) {
  syncInd.className = 'sync-indicator';
  if (state === 'loading') syncInd.classList.add('loading');
  if (state === 'error') syncInd.classList.add('error');
}

// ── DB operations ─────────────────────────────────────
async function loadStudents() {
  setSyncState('loading');
  try {
    const { data, error } = await supabase.from('students').select('*').order('created_at', { ascending: true });
    if (error) throw error;
    students = data || [];
    setSyncState('ok');
    return students;
  } catch (err) {
    console.error('Load error:', err);
    setSyncState('error');
    alert('Ошибка загрузки данных. Проверьте подключение.');
    return [];
  }
}

async function saveStudentDB(student) {
  setSyncState('loading');
  try {
    const { error } = await supabase.from('students').insert([student]);
    if (error) throw error;
    students.push(student);
    setSyncState('ok');
    return true;
  } catch (err) {
    console.error('Save error:', err);
    setSyncState('error');
    alert('Ошибка сохранения. Попробуйте ещё раз.');
    return false;
  }
}

async function updateStudentDB(id, updates) {
  setSyncState('loading');
  try {
    const { error } = await supabase.from('students').update(updates).eq('id', id);
    if (error) throw error;
    const idx = students.findIndex(s => s.id === id);
    if (idx !== -1) students[idx] = { ...students[idx], ...updates };
    setSyncState('ok');
    return true;
  } catch (err) {
    console.error('Update error:', err);
    setSyncState('error');
    alert('Ошибка обновления. Попробуйте ещё раз.');
    return false;
  }
}

async function deleteStudentDB(id) {
  setSyncState('loading');
  try {
    const { error } = await supabase.from('students').delete().eq('id', id);
    if (error) throw error;
    students = students.filter(s => s.id !== id);
    setSyncState('ok');
    return true;
  } catch (err) {
    console.error('Delete error:', err);
    setSyncState('error');
    alert('Ошибка удаления. Попробуйте ещё раз.');
    return false;
  }
}

// ── Utilities ─────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name) {
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function getS(id) { return students.find(s=>s.id===id); }
function balance(s) {
  const paid = (s.payments||[]).reduce((a,p)=>a+p.lessons,0);
  const used = (s.lessons ||[]).reduce((a,l)=>a+l.count,0);
  return paid - used;
}

// ── Render ────────────────────────────────────────────
function render() {
  renderList();
  sel ? renderDetail(sel) : renderPlaceholder();
}

function renderList() {
  const el = document.getElementById('studentList');
  if (!students.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">👩‍🎓</div>Нет учеников.<br>Нажмите «+ Добавить».</div>`;
    return;
  }
  el.innerHTML = students.map(s => {
    const bal = balance(s);
    const bc  = bal > 2 ? 'bal-ok' : bal > 0 ? 'bal-warn' : 'bal-zero';
    const active = s.id === sel ? ' active' : '';
    return `<div class="s-item${active}" tabindex="0" role="button"
        onclick="selectS('${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' ')selectS('${s.id}')">
      <div class="s-avatar">${esc(initials(s.name))}</div>
      <div class="s-info">
        <div class="s-name">${esc(s.name)}</div>
        ${s.subject ? `<div class="s-sub">${esc(s.subject)}</div>` : '<div class="s-sub" style="height:16px"></div>'}
      </div>
      <span class="bal ${bc}">${bal}</span>
    </div>`;
  }).join('');
}

function renderPlaceholder() {
  document.getElementById('detail').innerHTML =
    `<div class="detail-ph"><div class="icon">👈</div><p style="font-size:14px">Выберите ученика слева</p></div>`;
}

function renderDetail(id) {
  const s = getS(id);
  if (!s) { renderPlaceholder(); return; }

  const bal  = balance(s);
  const paid = (s.payments||[]).reduce((a,p)=>a+p.lessons,0);
  const used = (s.lessons ||[]).reduce((a,l)=>a+l.count,0);
  const bc   = bal > 2 ? 'ok' : bal > 0 ? 'warn' : 'low';

  const rows = [
    ...(s.payments||[]).map(p=>({...p,_t:'pay'})),
    ...(s.lessons ||[]).map(l=>({...l,_t:'use'})),
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const tBody = rows.length ? rows.map(r => {
    if (r._t === 'pay') {
      return `<tr>
        <td>${fmtDate(r.date)}</td>
        <td><span class="tag tag-pay">Оплата</span></td>
        <td class="mono" style="color:var(--success);font-weight:600">+${r.lessons} зан.</td>
        <td style="color:var(--muted)">${r.note ? esc(r.note) : '—'}</td>
        <td><button class="btn btn-icon btn-danger btn-sm" onclick="delEntry('${s.id}','pay','${r.id}')" aria-label="Удалить">✕</button></td>
      </tr>`;
    } else {
      return `<tr>
        <td>${fmtDate(r.date)}</td>
        <td><span class="tag tag-use">Занятие</span></td>
        <td class="mono" style="color:var(--muted)">−${r.count} зан.</td>
        <td style="color:var(--muted)">${r.note ? esc(r.note) : '—'}</td>
        <td><button class="btn btn-icon btn-danger btn-sm" onclick="delEntry('${s.id}','use','${r.id}')" aria-label="Удалить">✕</button></td>
      </tr>`;
    }
  }).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px;font-size:13px">Записей пока нет</td></tr>`;

  document.getElementById('detail').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap">
      <div>
        <div style="font-size:20px;font-weight:700;line-height:1.2">${esc(s.name)}</div>
        ${s.subject ? `<div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(s.subject)}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">
        <button class="btn btn-primary btn-sm" onclick="openAddPay('${s.id}')">+ Оплата</button>
        <button class="btn btn-danger  btn-sm" style="font-size:12px" onclick="openDelStudent('${s.id}')">Удалить</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-lbl">Остаток</div>
        <div class="stat-val ${bc}">${bal}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Оплачено</div>
        <div class="stat-val">${paid}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Проведено</div>
        <div class="stat-val">${used}</div>
      </div>
    </div>

    <div class="lesson-btn-wrap">
      <button class="lesson-btn${bal<0?' debt':''}" onclick="openLesson('${s.id}')">
        <span style="font-size:18px">${bal<0?'⚠️':'✅'}</span>
        Занятие прошло${bal<0?' (долг: '+Math.abs(bal)+' зан.)':bal===0?' (баланс 0)':''}
      </button>
    </div>

    <div class="card">
      <div class="card-hd"><h2>История</h2></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Дата</th><th>Тип</th><th>Занятия</th><th>Заметка</th><th></th></tr></thead>
          <tbody>${tBody}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ── Student CRUD ──────────────────────────────────────
window.selectS = function(id) { sel = id; render(); };

window.openAddStudent = function() {
  document.getElementById('sName').value  = '';
  document.getElementById('sSubj').value  = '';
  document.getElementById('eSName').textContent = '';
  openM('mAddStudent');
  setTimeout(()=>document.getElementById('sName').focus(),180);
};

window.saveStudent = async function() {
  const name = document.getElementById('sName').value.trim();
  const subj = document.getElementById('sSubj').value.trim();
  if (!name) { document.getElementById('eSName').textContent = 'Введите имя'; return; }
  document.getElementById('eSName').textContent = '';
  
  const s = { 
    id: uid(), 
    name, 
    subject: subj, 
    payments: [], 
    lessons: [], 
    created_at: new Date().toISOString() 
  };
  
  const ok = await saveStudentDB(s);
  if (!ok) return;
  
  closeM('mAddStudent');
  sel = s.id;
  render();
};

window.openDelStudent = function(id) {
  const s = getS(id);
  pendDel = id;
  document.getElementById('delStudentText').textContent =
    `Удалить ученика «${s.name}» и все его записи? Это действие нельзя отменить.`;
  openM('mDelStudent');
};

window.confirmDelStudent = async function() {
  const ok = await deleteStudentDB(pendDel);
  if (!ok) return;
  
  if (sel === pendDel) sel = students.length ? students[0].id : null;
  pendDel = null;
  closeM('mDelStudent');
  render();
};

// ── Payment ───────────────────────────────────────────
window.openAddPay = function(id) {
  sel = id;
  document.getElementById('pDate').value    = today();
  document.getElementById('pLessons').value = '';
  document.getElementById('pNote').value    = '';
  document.getElementById('ePLessons').textContent = '';
  openM('mAddPay');
  setTimeout(()=>document.getElementById('pLessons').focus(),180);
};

window.savePay = async function() {
  const lessons = parseInt(document.getElementById('pLessons').value);
  const date    = document.getElementById('pDate').value || today();
  const note    = document.getElementById('pNote').value.trim();
  if (!lessons || lessons < 1) {
    document.getElementById('ePLessons').textContent = 'Введите количество занятий';
    return;
  }
  document.getElementById('ePLessons').textContent = '';
  
  const s = getS(sel);
  if (!s) return;
  
  const newPayments = [...(s.payments||[]), { id:uid(), date, lessons, note }];
  const ok = await updateStudentDB(sel, { payments: newPayments });
  if (!ok) return;
  
  closeM('mAddPay');
  render();
};

// ── Lessons ───────────────────────────────────────────
window.openLesson = function(id) {
  sel = id;
  document.getElementById('lDate').value  = today();
  document.getElementById('lCount').value = '1';
  document.getElementById('lNote').value  = '';
  document.getElementById('eLCount').textContent = '';
  openM('mLesson');
  setTimeout(()=>document.getElementById('lNote').focus(),180);
};

window.saveLesson = async function() {
  const count = parseInt(document.getElementById('lCount').value);
  const date  = document.getElementById('lDate').value || today();
  const note  = document.getElementById('lNote').value.trim();
  if (!count || count < 1) {
    document.getElementById('eLCount').textContent = 'Введите количество';
    return;
  }
  document.getElementById('eLCount').textContent = '';
  
  const s = getS(sel);
  if (!s) return;
  
  const newLessons = [...(s.lessons||[]), { id:uid(), date, count, note }];
  const ok = await updateStudentDB(sel, { lessons: newLessons });
  if (!ok) return;
  
  closeM('mLesson');
  render();
};

// ── Delete entry ──────────────────────────────────────
window.delEntry = async function(sid, type, eid) {
  const s = getS(sid);
  if (!s) return;
  
  const updates = {};
  if (type === 'pay') updates.payments = s.payments.filter(p=>p.id!==eid);
  else                updates.lessons  = (s.lessons||[]).filter(l=>l.id!==eid);
  
  const ok = await updateStudentDB(sid, updates);
  if (!ok) return;
  
  render();
};

// ── Modals ────────────────────────────────────────────
function openM(id)  { document.getElementById(id).classList.add('open'); }
function closeM(id) { document.getElementById(id).classList.remove('open'); }
window.closeM = closeM;

document.querySelectorAll('.backdrop').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeM(el.id); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')
    ['mAddStudent','mAddPay','mLesson','mDelStudent'].forEach(closeM);
});

// ── Init ──────────────────────────────────────────────
document.getElementById('hdrDate').textContent =
  new Date().toLocaleDateString('ru-RU', {weekday:'long',day:'numeric',month:'long'});

showLoading();
loadStudents().then(() => {
  hideLoading();
  if (students.length) sel = students[0].id;
  render();
});
</script>
</body>
</html>
