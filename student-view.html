<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои занятия</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         oklch(97% 0.005 250);
      --surface:    oklch(100% 0 0);
      --raised:     oklch(95% 0.008 250);
      --border:     oklch(88% 0.010 250);
      --muted:      oklch(58% 0.015 250);
      --body:       oklch(20% 0.015 250);
      --accent:     oklch(56% 0.18  250);
      --accent-lt:  oklch(94% 0.04  250);
      --success:    oklch(54% 0.16  150);
      --success-lt: oklch(94% 0.04  150);
      --danger:     oklch(52% 0.18   25);
      --danger-lt:  oklch(95% 0.04   25);
      --warn:       oklch(62% 0.16   75);
      --warn-lt:    oklch(96% 0.04   75);
      --r: 10px; --r-lg: 16px;
      --sh-sm: 0 1px 3px oklch(0% 0 0 / .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         oklch(14% 0.010 250);
        --surface:    oklch(18% 0.012 250);
        --raised:     oklch(22% 0.012 250);
        --border:     oklch(30% 0.014 250);
        --muted:      oklch(60% 0.012 250);
        --body:       oklch(92% 0.008 250);
        --accent:     oklch(68% 0.16  250);
        --accent-lt:  oklch(22% 0.05  250);
        --success:    oklch(66% 0.14  150);
        --success-lt: oklch(20% 0.05  150);
        --danger:     oklch(66% 0.16   25);
        --danger-lt:  oklch(20% 0.06   25);
        --warn:       oklch(74% 0.14   75);
        --warn-lt:    oklch(20% 0.05   75);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100dvh;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .header .subject {
      font-size: 14px;
      color: var(--muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-hd {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .card-hd h2 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
    }
    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr 1fr; }
    }
    .stat {
      background: var(--surface);
      padding: 20px 16px;
      text-align: center;
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-val.ok   { color: var(--success); }
    .stat-val.warn { color: var(--warn);    }
    .stat-val.low  { color: var(--danger);  }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead {
      background: var(--raised);
    }
    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: var(--raised);
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 100px;
    }
    .tag-pay { background: var(--success-lt); color: var(--success); }
    .tag-use { background: var(--raised); color: var(--muted); border: 1px solid var(--border); }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: var(--danger);
      background: var(--danger-lt);
      border-radius: var(--r);
      margin: 20px 0;
    }
    .error-icon { font-size: 32px; margin-bottom: 8px; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .footer {
      text-align: center;
      padding: 32px 20px 20px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Загрузка данных...</p>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://nmexbqjqmwjsdwhuerkw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZXhicWpxbXdqc2R3aHVlcmt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODc1MjgsImV4cCI6MjEwNDM2MzUyOH0.ydUjLGVtoEd6P8JIBYMlGicdNXTr4qJNr0BjiP1VEIE';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Get student ID from URL
const params = new URLSearchParams(window.location.search);
const studentId = params.get('id');

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function balance(student) {
  const paid = (student.payments || []).reduce((a, p) => a + p.lessons, 0);
  const used = (student.lessons || []).reduce((a, l) => a + l.count, 0);
  return paid - used;
}

function render(student) {
  const bal = balance(student);
  const paid = (student.payments || []).reduce((a, p) => a + p.lessons, 0);
  const used = (student.lessons || []).reduce((a, l) => a + l.count, 0);
  const bc = bal > 2 ? 'ok' : bal > 0 ? 'warn' : 'low';

  // Merge timeline
  const rows = [
    ...(student.payments || []).map(p => ({ ...p, _t: 'pay' })),
    ...(student.lessons || []).map(l => ({ ...l, _t: 'use' })),
  ].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const tBody = rows.length
    ? rows.map(r => {
        if (r._t === 'pay') {
          return `<tr>
            <td>${fmtDate(r.date)}</td>
            <td><span class="tag tag-pay">Оплата</span></td>
            <td style="color:var(--success);font-weight:600;font-variant-numeric:tabular-nums">+${r.lessons} зан.</td>
            <td style="color:var(--muted)">${r.note ? esc(r.note) : '—'}</td>
          </tr>`;
        } else {
          return `<tr>
            <td>${fmtDate(r.date)}</td>
            <td><span class="tag tag-use">Занятие</span></td>
            <td style="color:var(--muted);font-variant-numeric:tabular-nums">−${r.count} зан.</td>
            <td style="color:var(--muted)">${r.note ? esc(r.note) : '—'}</td>
          </tr>`;
        }
      }).join('')
    : `<tr><td colspan="4" class="empty">Записей пока нет</td></tr>`;

  document.getElementById('content').innerHTML = `
    <div class="header">
      <h1>${esc(student.name)}</h1>
      ${student.subject ? `<div class="subject">${esc(student.subject)}</div>` : ''}
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat">
          <div class="stat-lbl">Остаток</div>
          <div class="stat-val ${bc}">${bal}</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Оплачено</div>
          <div class="stat-val">${paid}</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Проведено</div>
          <div class="stat-val">${used}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><h2>История занятий</h2></div>
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Тип</th>
            <th>Занятия</th>
            <th>Заметка</th>
          </tr>
        </thead>
        <tbody>${tBody}</tbody>
      </table>
    </div>

    <div class="footer">
      Данные обновляются автоматически.<br>
      При возникновении вопросов обратитесь к преподавателю.
    </div>
  `;
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="error">
      <div class="error-icon">⚠️</div>
      <p>${esc(message)}</p>
    </div>
  `;
}

async function load() {
  if (!studentId) {
    showError('Неверная ссылка. Попросите преподавателя выслать правильную ссылку.');
    return;
  }

  try {
    const { data, error } = await supabase
      .from('students')
      .select('*')
      .eq('id', studentId)
      .single();

    if (error) throw error;
    if (!data) {
      showError('Ученик не найден. Проверьте ссылку или обратитесь к преподавателю.');
      return;
    }

    render(data);
  } catch (err) {
    console.error('Load error:', err);
    showError('Ошибка загрузки данных. Проверьте подключение к интернету.');
  }
}

load();
</script>
</body>
</html>
